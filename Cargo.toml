[workspace]
resolver = "2"
members = [
    "crates/link-protocol",
    "crates/link-crypto",
    "crates/link-transport",
    "apps/jlshell-agent",
    "apps/jlshell-connector",
    "apps/jlshell-relay",
    "apps/jlshell-linkctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["JLShell"]
publish = false

[workspace.dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
clap = { version = "=4.6.4", features = ["derive"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
futures = "=0.3.33"
hex = "=0.4.3"
libp2p = { version = "=0.56.0", features = [
    "autonat",
    "dcutr",
    "dns",
    "ed25519",
    "identify",
    "macros",
    "noise",
    "ping",
    "quic",
    "relay",
    "serde",
    "tcp",
    "tls",
    "tokio",
    "yamux",
] }
libp2p-stream = "=0.4.0-alpha"
parking_lot = "=0.12.5"
prost = "=0.14.4"
rand = "=0.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
