name: Package Java Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: Agent package version, for example 0.1.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate branch and version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/develop ]]; then
            echo 'Agent packages may only be built from develop after review.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'Version must be an explicit Maven release or prerelease version.' >&2
            exit 1
          fi
      - name: Verify Link modules
        run: mvn -B -ntp verify
      - name: Enforce candidate dependency, license and secret gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' bom; do args+=(--sbom "$bom"); done < <(find . -mindepth 3 -path '*/target/bom.json' -print0)
          test "${#args[@]}" -gt 0
          python3 scripts/security/scan.py --secrets "${args[@]}" --output security-report.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: candidate-delivery-security
          path: security-report.json
          if-no-files-found: ignore
      - name: Set candidate version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Build shaded Agent
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: mvn -B -ntp -pl link-agent -am -DskipTests "-Djlshell.build.revision=$SOURCE_REVISION" package
      - name: Package Java 21 Agent (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: scripts/package-java-agent.sh "$RELEASE_VERSION"
      - name: Package Java 21 Agent (Windows)
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          python scripts/package-java-agent.py `
            --version $env:RELEASE_VERSION `
            --agent-jar "link-agent/target/link-agent-$env:RELEASE_VERSION.jar" `
            --output-dir link-agent/target/distribution
      - uses: actions/upload-artifact@v4
        with:
          name: jlshell-link-agent-java-${{ inputs.version }}-${{ matrix.platform }}
          path: link-agent/target/distribution/*
          if-no-files-found: error
          retention-days: 90

  sign-candidate:
    if: github.ref == 'refs/heads/develop'
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: jlshell-link-agent-java-${{ inputs.version }}-*
          path: dist
          merge-multiple: true
      - name: Audit candidate platform packages before signing
        run: python3 scripts/security/audit-platform-packages.py --directory dist --output candidate-platform-security.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-platform-security
          path: candidate-platform-security.json
          if-no-files-found: ignore
      - name: Sign exact candidate manifests
        env:
          JLSHELL_AGENT_PUBLISHER_PRIVATE_KEY: ${{ secrets.JLSHELL_AGENT_PUBLISHER_PRIVATE_KEY }}
        run: python3 scripts/sign-agent-manifests.py --directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: jlshell-link-agent-java-${{ inputs.version }}-signed-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 14
