name: Relay Container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: edge
        type: string
  push:
    branches: [develop, main, feature/relay-docker-orchestration]
    paths:
      - docker/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/jlshell-relay/**

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image tag
        id: metadata
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_IMAGE_TAG" ]]; then
            tag="$INPUT_IMAGE_TAG"
          else
            tag="${GITHUB_REF_NAME//\//-}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build and publish Relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          push: true
          tags: ghcr.io/voghost/jlshell-link-relay:${{ steps.metadata.outputs.tag }}
