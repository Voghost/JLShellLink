name: Release Java Agent

on:
  workflow_dispatch:
    inputs:
      version:
        description: Java Agent version to publish, for example 0.1.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate release source and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Stable Agent packages may only be built from main.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo 'Version must be an explicit release or prerelease version.' >&2
            exit 1
          fi
      - name: Verify Link modules
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: mvn -B -ntp verify "-Djlshell.build.revision=$SOURCE_REVISION"
      - name: Enforce Java delivery vulnerability and secret gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' bom; do args+=(--sbom "$bom"); done < <(find . -mindepth 3 -path '*/target/bom.json' -print0)
          test "${#args[@]}" -gt 0
          python3 scripts/security/scan.py --secrets "${args[@]}" --output security-report.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: java-delivery-security
          path: security-report.json
          if-no-files-found: ignore
      - name: Set Agent package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
      - name: Build shaded Agent
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: mvn -B -ntp -pl link-agent -am -DskipTests package "-Djlshell.build.revision=$SOURCE_REVISION"
      - name: Package Java 21 Agent (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: scripts/package-java-agent.sh "$RELEASE_VERSION"
      - name: Package Java 21 Agent (Windows)
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          python scripts/package-java-agent.py `
            --version $env:RELEASE_VERSION `
            --agent-jar "link-agent/target/link-agent-$env:RELEASE_VERSION.jar" `
            --output-dir link-agent/target/distribution
      - uses: actions/upload-artifact@v4
        with:
          name: jlshell-link-agent-java-${{ inputs.version }}-${{ matrix.platform }}
          path: link-agent/target/distribution/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jlshell-link-agent-java-${{ inputs.version }}-*
          merge-multiple: true
      - name: Audit actual platform packages before signing
        run: python3 scripts/security/audit-platform-packages.py --directory dist --output platform-security.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-security
          path: platform-security.json
          if-no-files-found: ignore
      - name: Sign platform manifests
        env:
          JLSHELL_AGENT_PUBLISHER_PRIVATE_KEY: ${{ secrets.JLSHELL_AGENT_PUBLISHER_PRIVATE_KEY }}
        run: python3 scripts/sign-agent-manifests.py --directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: jlshell-link-agent-java-${{ inputs.version }}-signed-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload and publish Java Agent packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          JLSHELL_SITE_URL: ${{ vars.JLSHELL_SITE_URL }}
          JLSHELL_ACTION_WEBHOOK_SECRET: ${{ secrets.JLSHELL_ACTION_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${JLSHELL_ACTION_WEBHOOK_SECRET:-}" ]]; then
            echo 'Missing required repository secret: JLSHELL_ACTION_WEBHOOK_SECRET' >&2
            exit 1
          fi
          site_url="${JLSHELL_SITE_URL:-}"
          if [[ "$site_url" != https://* ]]; then
            echo 'Set repository variable JLSHELL_SITE_URL to the HTTPS Website origin.' >&2
            exit 1
          fi
          site_url="${site_url%/}"
          release_id="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#assets[@]}" -ne 15 ]]; then
            echo 'Expected 15 Java Agent archives, manifests, signatures, and checksum files.' >&2
            exit 1
          fi
          files_json='[]'
          for asset in "${assets[@]}"; do
            file_name="$(basename "$asset")"
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            request_path="/api/v1/actions/link-runtime/java/${RELEASE_VERSION}/${release_id}/${file_name}"
            timestamp="$(date +%s)"
            signature="sha256=$(printf '%s.%s.%s' "$timestamp" "$request_path" "$digest" \
              | openssl dgst -sha256 -hmac "$JLSHELL_ACTION_WEBHOOK_SECRET" -hex \
              | awk '{print $2}')"
            curl --fail --silent --show-error -X PUT "${site_url}${request_path}" \
              -H 'Content-Type: application/octet-stream' \
              -H "X-JLShell-Timestamp: $timestamp" \
              -H "X-JLShell-Signature: $signature" \
              -H "X-JLShell-SHA256: $digest" \
              --data-binary "@$asset"
            files_json="$(python3 -c 'import json,sys; values=json.loads(sys.argv[1]); values.append(sys.argv[2]); print(json.dumps(values,separators=(",",":")))' \
              "$files_json" "$file_name")"
          done
          body="$(python3 -c 'import json,sys; print(json.dumps({"files":json.loads(sys.argv[1])},separators=(",",":")))' "$files_json")"
          timestamp="$(date +%s)"
          signature="sha256=$(printf '%s.%s' "$timestamp" "$body" \
            | openssl dgst -sha256 -hmac "$JLSHELL_ACTION_WEBHOOK_SECRET" -hex \
            | awk '{print $2}')"
          curl --fail --silent --show-error -X POST \
            "${site_url}/api/v1/actions/link-runtime/java/${RELEASE_VERSION}/${release_id}/publish" \
            -H 'Content-Type: application/json' \
            -H "X-JLShell-Timestamp: $timestamp" \
            -H "X-JLShell-Signature: $signature" \
            --data "$body"
