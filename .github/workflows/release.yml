name: Prototype Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: jlshell-link-linux-x64.tar.gz
            agent_asset: jlshell-agent-linux-x64
            connector_asset: jlshell-connector-linux-x64
            exe: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: jlshell-link-macos-arm64.tar.gz
            agent_asset: jlshell-agent-macos-arm64
            connector_asset: jlshell-connector-macos-arm64
            exe: ''
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: jlshell-link-windows-x64.tar.gz
            agent_asset: jlshell-agent-windows-x64.exe
            connector_asset: jlshell-connector-windows-x64.exe
            exe: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package unsigned prototype
        shell: bash
        run: |
          mkdir -p dist/package
          for binary in jlshell-agent jlshell-connector jlshell-relay jlshell-linkctl; do
            cp "target/${{ matrix.target }}/release/${binary}${{ matrix.exe }}" dist/package/
          done
          cp "target/${{ matrix.target }}/release/jlshell-agent${{ matrix.exe }}" \
            "dist/package/${{ matrix.agent_asset }}"
          cp "target/${{ matrix.target }}/release/jlshell-connector${{ matrix.exe }}" \
            "dist/package/${{ matrix.connector_asset }}"
          tar -czf "dist/${{ matrix.archive }}" -C dist/package .
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble verified Program plugin runtime bundle
        run: >-
          python3 scripts/create-plugin-runtime-bundle.py
          --version "${GITHUB_REF_NAME#v}"
          --archives dist
          --output dist
      - name: Add the one-command Agent installer
        run: |
          cp scripts/install-agent.sh dist/install-agent.sh
          chmod 755 dist/install-agent.sh
      - name: Upload Runtime assets through JLShell Website
        env:
          JLSHELL_SITE_URL: ${{ vars.JLSHELL_SITE_URL }}
          JLSHELL_ACTION_WEBHOOK_SECRET: ${{ secrets.JLSHELL_ACTION_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          site_url="${JLSHELL_SITE_URL:-https://jlshell.oomn.net}"
          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$JLSHELL_ACTION_WEBHOOK_SECRET" ]]; then
            echo "Missing required GitHub secret: JLSHELL_ACTION_WEBHOOK_SECRET" >&2
            exit 1
          fi

          files_json='[]'
          while IFS= read -r -d '' asset; do
            file_name="$(basename "$asset")"
            sha256="$(sha256sum "$asset" | awk '{print $1}')"
            request_path="/api/v1/actions/link-runtime/${version}/${file_name}"
            timestamp="$(date +%s)"
            signature="sha256=$(printf '%s.%s.%s' "$timestamp" "$request_path" "$sha256" \
              | openssl dgst -sha256 -hmac "$JLSHELL_ACTION_WEBHOOK_SECRET" -hex \
              | awk '{print $2}')"
            curl -fS -X PUT "${site_url%/}${request_path}" \
              -H 'Content-Type: application/octet-stream' \
              -H "X-JLShell-Timestamp: $timestamp" \
              -H "X-JLShell-Signature: $signature" \
              -H "X-JLShell-SHA256: $sha256" \
              --data-binary "@$asset"
            files_json="$(python3 -c 'import json,sys; files=json.loads(sys.argv[1]); files.append(sys.argv[2]); print(json.dumps(files,separators=(",",":")))' "$files_json" "$file_name")"
          done < <(find dist -maxdepth 1 -type f -print0)

          body="$(python3 -c 'import json,sys; print(json.dumps({"files":json.loads(sys.argv[1])},separators=(",",":")))' "$files_json")"
          timestamp="$(date +%s)"
          signature="sha256=$(printf '%s.%s' "$timestamp" "$body" \
            | openssl dgst -sha256 -hmac "$JLSHELL_ACTION_WEBHOOK_SECRET" -hex \
            | awk '{print $2}')"
          curl -fS -X POST "${site_url%/}/api/v1/actions/link-runtime/${version}/publish" \
            -H 'Content-Type: application/json' \
            -H "X-JLShell-Timestamp: $timestamp" \
            -H "X-JLShell-Signature: $signature" \
            --data "$body"
      - name: Create private unsigned prototype release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find dist -maxdepth 1 -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release files were produced" >&2
            exit 1
          fi
          notes="Unsigned prototype. The jlshell-link-plugin-runtime archive is consumed by the private Program plugin build and includes a SHA-256 manifest; the executables themselves are not code-signed yet."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME (unsigned prototype)" --prerelease --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME (unsigned prototype)" --prerelease --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
