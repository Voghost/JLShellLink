name: Publish Java libraries

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Stable main release or commit-unique develop integration artifact
        required: true
        default: stable
        type: choice
        options: [stable, internal]
      version:
        description: Maven version to publish, for example 0.1.0
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve branch-bound immutable Maven version
        id: publication
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_MODE" == internal ]]; then
            if [[ "$GITHUB_REF" != refs/heads/develop || ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Internal artifacts require an exact develop commit.' >&2
              exit 1
            fi
            if [[ -n "$RELEASE_VERSION" ]]; then
              echo 'Internal versions are generated from the source SHA; leave version empty.' >&2
              exit 1
            fi
            RELEASE_VERSION="0.0.0-internal.g$GITHUB_SHA"
          elif [[ "$PUBLISH_MODE" == stable || -z "$PUBLISH_MODE" ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo 'Stable Java library releases may only be published from main.' >&2
              exit 1
            fi
          else
            echo 'Unknown publication mode.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo 'Version must be strict SemVer.' >&2
            exit 1
          fi
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Validate version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.publication.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'Version must be an explicit Maven release or prerelease version' >&2
            exit 1
          fi
      - name: Set Maven version
        env:
          RELEASE_VERSION: ${{ steps.publication.outputs.version }}
        run: >-
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="$RELEASE_VERSION"
          -DgenerateBackupPoms=false
      - name: Build and verify Java artifacts before publishing
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: mvn -B -ntp verify "-Djlshell.build.revision=$SOURCE_REVISION"
      - name: Verify Maven JAR provenance and CycloneDX SBOMs
        env:
          SOURCE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' artifact; do
            found=1
            if ! unzip -p "$artifact" META-INF/MANIFEST.MF | tr -d '\r' | grep -Fqx "JLShell-Build-Revision: $SOURCE_REVISION"; then
              echo "Missing build revision in $artifact" >&2
              exit 1
            fi
            bom="$(dirname "$artifact")/bom.json"
            if [[ ! -f "$bom" ]] || ! python3 -c 'import json,sys; b=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(b,dict) and b.get("bomFormat")=="CycloneDX" and isinstance(b.get("components"),list)' "$bom"; then
              echo "Missing or invalid CycloneDX SBOM for $artifact" >&2
              exit 1
            fi
          done < <(find . -path '*/target/*.jar' -type f -print0)
          if [[ "$found" -eq 0 ]]; then
            echo 'Maven build produced no JAR files.' >&2
            exit 1
          fi
      - name: Publish verified private Java artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ github.sha }}
        run: mvn -B -ntp deploy -DskipTests "-Djlshell.build.revision=$SOURCE_REVISION"
