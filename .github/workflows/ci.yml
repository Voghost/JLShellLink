name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read
  checks: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/libp2p-relay/Cargo.toml --all -- --check
      - run: sh -n docker/relay-entrypoint.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test pinned Relay security patch
        run: cargo test --manifest-path vendor/libp2p-relay/Cargo.toml --locked
      - run: cargo build --workspace --locked
      - name: Verify vulnerable DNS code is not in the build graph
        shell: bash
        run: |
          if cargo tree --edges normal --prefix none --format '{p}' | grep -q '^hickory-proto '; then
            echo 'hickory-proto must remain outside the active dependency graph'
            exit 1
          fi
      - name: Attempt dual-network namespace Relay smoke test
        continue-on-error: true
        run: sudo env JLSHELL_LINK_BIN_DIR="$PWD/target/debug" ./scripts/linux-netns-smoke.sh
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # libp2p 0.56 keeps disabled optional DNS crates in Cargo.lock. The
          # preceding build-graph check makes these two exceptions fail closed.
          ignore: RUSTSEC-2026-0118,RUSTSEC-2026-0119

  native-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  linux-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --target x86_64-unknown-linux-musl

  relay-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Relay container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          push: false
          tags: jlshell-link-relay:ci
