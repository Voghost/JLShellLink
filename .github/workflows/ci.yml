name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read
  checks: write

jobs:
  java-poc:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify Java Link POC
        env:
          JLSHELL_LINK_ICE_TEST_ENABLED: ${{ matrix.runner != 'windows-2025' }}
        run: mvn -B -ntp verify
      - name: Enforce Java delivery vulnerability and secret gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r -d '' bom; do args+=(--sbom "$bom"); done < <(find . -path '*/target/bom.json' -print0)
          test "${#args[@]}" -gt 0
          python3 scripts/security/scan.py --secrets "${args[@]}" --output security-report.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: java-delivery-security
          path: security-report.json
          if-no-files-found: ignore
      - name: Parse Windows Agent service installer
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: |
          foreach ($path in @(
            "$PWD/scripts/java-agent/install-windows-service.ps1",
            "$PWD/scripts/java-agent/test-windows-service.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
      - name: Exercise Windows Agent service lifecycle
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: ./scripts/java-agent/test-windows-service.ps1 -AgentJarPath ./link-agent/target/link-agent-0.1.0-SNAPSHOT.jar
      - name: Validate Java Agent shell scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n scripts/java-agent/run-agent.sh
          sh -n scripts/java-agent/stop-agent.sh
          sh -n scripts/java-agent/install-user-service.sh
          sh -n scripts/java-agent/test-macos-service.sh
          sh -n scripts/package-java-agent.sh
      - name: Exercise macOS Agent LaunchAgent lifecycle
        if: matrix.runner == 'macos-15'
        shell: bash
        run: sh scripts/java-agent/test-macos-service.sh
      - name: Build and inspect Java Agent archives
        if: runner.os != 'Windows'
        shell: bash
        run: |
          scripts/package-java-agent.sh 0.1.0-CI link-agent/target/link-agent-0.1.0-SNAPSHOT.jar
          test -n "$(find link-agent/target/distribution -maxdepth 1 -name 'jlshell-link-agent-java-0.1.0-CI-*.tar.gz' -print -quit)"
          test -n "$(find link-agent/target/distribution -maxdepth 1 -name 'jlshell-link-agent-java-0.1.0-CI-*.zip' -print -quit)"
          test -n "$(find link-agent/target/distribution -maxdepth 1 -name 'jlshell-link-agent-java-0.1.0-CI-*.manifest.json' -print -quit)"
          test -n "$(find link-agent/target/distribution -maxdepth 1 -name 'jlshell-link-agent-java-0.1.0-CI-*.sha256' -print -quit)"
      - name: Build and inspect Java Agent archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-java-agent.py `
            --version 0.1.0-CI `
            --agent-jar link-agent/target/link-agent-0.1.0-SNAPSHOT.jar `
            --output-dir link-agent/target/distribution
          foreach ($suffix in @('.tar.gz', '.zip', '.manifest.json', '.sha256')) {
            if (-not (Test-Path (Join-Path 'link-agent/target/distribution' "jlshell-link-agent-java-0.1.0-CI-windows-x64$suffix"))) {
              throw "Windows Java Agent output is missing: $suffix"
            }
          }

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path vendor/libp2p-relay/Cargo.toml --all -- --check
      - run: sh -n docker/relay-entrypoint.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test pinned Relay security patch
        run: cargo test --manifest-path vendor/libp2p-relay/Cargo.toml --locked
      - run: cargo build --workspace --locked
      - name: Verify vulnerable DNS code is not in the build graph
        shell: bash
        run: |
          if cargo tree --edges normal --prefix none --format '{p}' | grep -q '^hickory-proto '; then
            echo 'hickory-proto must remain outside the active dependency graph'
            exit 1
          fi
      - name: Attempt dual-network namespace Relay smoke test
        continue-on-error: true
        run: sudo env JLSHELL_LINK_BIN_DIR="$PWD/target/debug" ./scripts/linux-netns-smoke.sh
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # libp2p 0.56 keeps disabled optional DNS crates in Cargo.lock. The
          # preceding build-graph check makes these two exceptions fail closed.
          ignore: RUSTSEC-2026-0118,RUSTSEC-2026-0119

  native-build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  linux-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked --target x86_64-unknown-linux-musl

  relay-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Relay container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.relay
          push: false
          tags: jlshell-link-relay:ci
